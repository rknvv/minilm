# SPEED-prototype profiling config: single A100, random-init, synthetic data.
# Throughput is weight-/value-independent, so this profiles the real CPT shapes
# (Gemma-3-1B, vocab 153856, seq 2048) without the real checkpoint or dataset.
#
# Setup:  python scripts/make_synth_profile_data.py
# Run:    python main.py --yaml_path=configs/profile_a100_1gpu_synth.yaml
# Numbers come from logs at iters 10..60 (step 1 with compile excluded automatically).
#
# Diff vs profile_a100_1gpu.yaml: dataset_dir, pretrained_checkpoint:null (-> random
# init), eval_interval raised above max_iters (skip eval during the speed window).
#
# Tuned stack (see out_profile/REPORT.md, A100 measured): trunk-only compile with
# max-autotune (fixes the flex-attention backward template: 36% -> 5% of GPU time)
# + batch 16 / accum 2 (fits in 68 GiB thanks to compile rematerializing the fp32
# upcasts). ~24.5k tok/s, MFU ~42.6% vs 8.8k/15.3% eager. Effective batch still 32.
train:
  task: "pretrain"
  out_dir: "./out_profile"
  dataset_dir: "./data/profile_synth"
  token_dtype: "auto"

  pretrained_checkpoint: null          # random init (no weights needed for speed)
  resume_from_checkpoint: false
  seed: 42

  eval_interval: 1000                  # > max_iters -> eval does not run
  log_interval: 10
  eval_iters: 50
  always_save_checkpoint: false

  wandb_log: false
  wandb_project: "gemma3_1b_cpt_ruen"
  wandb_run_name: "profile_a100_synth"

  gradient_accumulation_steps: 2
  train_batch_size: 16
  eval_batch_size: 16   # match train shape -> no recompile on first eval
  num_workers: 8

  learning_rate: 0.00005
  muon_lr: 0.0005
  max_iters: 60
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  decay_lr: true
  warmup_iters: 10
  min_lr_ratio: 0.1

  device: "cuda"
  dtype: "bfloat16"
  compile: true
  # max-autotune tunes the flex-attention backward template configs (the default
  # ones are pathological for H=4/hd=256/MQA: 30ms bwd vs 0.5ms fwd). First
  # compile takes ~7 min cold; the Inductor cache makes reruns cheap.
  compile_mode: "max-autotune-no-cudagraphs"
  backend: "nccl"
  # Chrome trace of optimizer steps 11-13 -> ./out_profile/trace_*.json
  profile: true
  eval_only: false

model:
  dim: 1152
  n_layers: 26
  n_heads: 4
  n_kv_heads: 1
  head_dim: 256
  vocab_size: 153856
  intermediate_size: 6912
  norm_eps: 0.000001
  max_seq_len: 2048
  dropout: 0.0

  query_pre_attn_scalar: 256.0
  rope_theta: 1000000.0
  rope_local_base_freq: 10000.0
  sliding_window: 512
  sliding_window_pattern: 6

  gradient_checkpointing: false
  # use_liger + ce_chunk_size>0 = VENDORED liger FLCE with our chunking
  # (models/fused_loss.py): liger's own heuristic degenerates to 256-row
  # chunks at this vocab (128 tiny GEMMs + 128 grad_weight accumulator passes
  # per micro-step). Measured A100: 34.2k tok/s MFU 59.4% vs 24.6k stock liger
  # vs 27.2k checkpointed chunked-CE. Peak 72.0 GiB at B16; drop chunk to 4096
  # (-2.3 GiB, -1% speed) if OOM. Parity: scripts/test_loss_parity_cuda.py.
  ce_chunk_size: 8192
  use_liger: true
