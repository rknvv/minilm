train:
  out_dir: "./out_profile"
  dataset_dir: "./data/profile_synth"
  token_dtype: "auto"

  pretrained_checkpoint: null
  resume_from_checkpoint: false
  seed: 42

  eval_interval: 1000
  log_interval: 10
  eval_iters: 50
  always_save_checkpoint: false

  wandb_log: false
  wandb_project: "gemma3_1b_cpt_ruen"
  wandb_run_name: "profile_a100_synth"

  gradient_accumulation_steps: 2
  train_batch_size: 16
  eval_batch_size: 16
  num_workers: 8

  learning_rate: 0.00005
  muon_lr: 0.0005
  max_iters: 60
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  decay_lr: true
  warmup_iters: 10
  min_lr_ratio: 0.1

  device: "cuda"
  dtype: "bfloat16"
  compile: true
  compile_mode: "max-autotune-no-cudagraphs"
  backend: "nccl"
  profile: true
  eval_only: false

model:
  dim: 1152
  n_layers: 26
  n_heads: 4
  n_kv_heads: 1
  head_dim: 256
  vocab_size: 153856
  intermediate_size: 6912
  norm_eps: 0.000001
  max_seq_len: 2048
  dropout: 0.0

  query_pre_attn_scalar: 256.0
  rope_theta: 1000000.0
  rope_local_base_freq: 10000.0
  sliding_window: 512
  sliding_window_pattern: 6

  gradient_checkpointing: false
  ce_chunk_size: 8192
  use_liger: true
  use_flex_attention: true
