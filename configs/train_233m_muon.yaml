train:
  task: "pretrain"
  out_dir: "./out_233m_owt_muon"
  dataset_dir: "/Volumes/KINGSTON/minilm/muon/data"
  resume_from_checkpoint: false
  resume_checkpoint_kind: "latest"

  eval_interval: 500
  log_interval: 20
  eval_iters: 100
  always_save_checkpoint: true

  wandb_log: true
  wandb_project: "minilm_muon"
  wandb_run_name: "owt_233m_muon_20260503"

  gradient_accumulation_steps: 8
  train_batch_size: 64
  eval_batch_size: 64
  num_workers: 8

  learning_rate: 0.0003
  max_iters: 18500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  decay_lr: true
  warmup_iters: 1000

  device: "cuda"
  dtype: "bfloat16"
  compile: true
  backend: "nccl"
  eval_only: false

model:
  dim: 1024
  n_layers: 18
  n_heads: 16
  n_kv_heads: 4
  vocab_size: 16384
  multiple_of: 256
  ffn_dim_multiplier: 1.125
  norm_eps: 0.00001
  max_seq_len: 1024
  dropout: 0.1
